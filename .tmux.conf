set -g prefix C-SPACE
set -g mouse on
set -g mode-keys vi
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g window-status-current-style "fg=green bold"
set -g escape-time 0
set -g base-index 1
set -g renumber-windows on
set -g pane-base-index 1
set -g status-left-length 50
set -g history-limit 75000
#set -g allow-passthrough on # claude notifications
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"

set -g set-clipboard on # getting nvim to send to remote
set -g escape-time 0 # Increase how much tmux will accept for escape sequences

# NOTE: Help:
# - L goes to last session, l goes to last client

bind r source-file ~/.tmux.conf \; display-message "Reloaded!"
bind f run-shell "tmux neww ~/bin/tmux-sessionizer"
bind SPACE run-shell "tmux neww ~/bin/tmux-sessionizer"
bind R command-prompt -I "#W" { rename-window "%%" }
# renumber-windows will sort this out
# "End"
bind E move-window -t 999

# Convenient global bindings with bad mnemonics
bind y run-shell "~/bin/gc-display 2" # displaY
bind u run-shell "~/.local/bin/tmux-gc-sudo-pass" # sUdo

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Like switching buffer in tmux session context
# can also just use leader-s 
# List all sessions except the current one (attached-elsewhere sessions still appear,
# so SSH zombie clients can't hide them).
bind , display-popup -E "\
    tmux list-sessions -F '#{?session_attached,#{?#{==:#{session_name},#{client_session}},,#{session_name}},#{session_name}}' |\
    sed '/^$/d' |\
    fzf --reverse --header jump-to-session --preview 'tmux capture-pane -pt {}'  |\
    xargs tmux switch-client -t"

bind C-k kill-session

# Claude agent overview: jump to any running agent across sessions.
bind a display-popup -w 80% -h 70% -E "~/bin/claude-status"

# Dictation (whisper.cpp). Toggle: once to record, again to transcribe and
# bracketed-paste into the pane it started from, unsubmitted. -b keeps the
# server responsive while whisper runs; the pane id must be passed explicitly
# because run-shell does not inherit the active pane.
bind -n M-v run-shell -b "~/bin/gc-dictate --pane '#{pane_id}'"
bind v run-shell -b "~/bin/gc-dictate --pane '#{pane_id}'"
bind V run-shell -b "~/bin/gc-dictate --clip"
bind C-v run-shell -b "~/bin/gc-dictate --cancel"

# Status bar: live Claude agent counts. ~/.tmux.conf.local may add more.
set -g status-interval 5
set -g status-right-length 100
# @claude_status is pushed by claude-status-hook for instant updates; #{E:...}
# re-expands it so the embedded #[...] colors render.
set -g status-right "#{E:@dictate_status}#{E:@claude_status}%H:%M "


# I think I can just use leader o and save this for my nvim mappings
#bind-key -n M-o select-pane -t :.+

bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# Paste the X clipboard, not the tmux buffer. -p brackets it so nvim/Claude see
# a paste rather than typed keys.
bind ] run-shell "xclip -selection clipboard -o | tmux load-buffer - && tmux paste-buffer -p"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"

run '~/.tmux/plugins/tpm/tpm'
