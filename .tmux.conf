set -g prefix C-SPACE
set -g mouse on
set -g mode-keys vi
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g window-status-current-style "fg=green bold"
set -g escape-time 0
set -g base-index 1
set -g renumber-windows on
set -g pane-base-index 1
set -g status-left-length 50
set -g history-limit 75000
# claude's native binary is named after its version (e.g. 2.1.318)
set -g automatic-rename-format "#{?pane_in_mode,[tmux],#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},#{=/10/…:#{s/^[^a-zA-Z0-9]+ //:pane_title}},#{pane_current_command}}}#{?pane_dead,[dead],}"
#set -g allow-passthrough on # claude notifications
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"

set -g set-clipboard on # getting nvim to send to remote
set -g escape-time 0 # Increase how much tmux will accept for escape sequences

# NOTE: Help:
# - L goes to last session, l goes to last client

bind r source-file ~/.tmux.conf \; display-message "Reloaded!"
bind f run-shell "tmux neww ~/bin/tmux-sessionizer"
bind SPACE run-shell "tmux neww ~/bin/tmux-sessionizer"
bind R command-prompt -I "#W" { rename-window "%%" }
# renumber-windows will sort this out
# "End"
bind E move-window -t 999

# Convenient global bindings with bad mnemonics
bind y run-shell "~/bin/gc-display 2" # displaY
bind u run-shell "~/.local/bin/tmux-gc-sudo-pass" # sUdo

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Like switching buffer in tmux session context
# can also just use leader-s 
# List all sessions except the current one, most recently attached first
# (attached-elsewhere sessions still appear, so SSH zombie clients can't hide them).
bind , display-popup -E "\
    tmux list-sessions -F '#{session_last_attached} #{?session_attached,#{?#{==:#{session_name},#{client_session}},,#{session_name}},#{session_name}}' |\
    sort -rn | cut -d' ' -f2- |\
    sed '/^$/d' |\
    fzf --reverse --header jump-to-session --preview 'tmux capture-pane -pt {}'  |\
    xargs tmux switch-client -t"

# Kill the current session after a y/n, landing in another session instead of detaching.
bind k confirm-before -p "kill session #S? (y/n)" kill-session
set -g detach-on-destroy off

# Claude agent overview: jump to any running agent across sessions.
bind a display-popup -w 80% -h 70% -E "~/bin/claude-agents"
# Toggle desktop notifications when an agent finishes or needs input (claude-agents notify).
bind N if -F "#{==:#{@claude_notify},on}" \
  { set -g @claude_notify off; display "Claude notifications off" } \
  { set -g @claude_notify on; display "Claude notifications on" }

# Review this pane's worktree (uncommitted changes, stageable) in nvim; claude_send
# targets the pane it was opened from.
bind g display-popup -w 95% -h 90% -d "#{pane_current_path}" -E "~/bin/review-worktree"

# gc-proj board: projects by state; jump, rename, re-file, finish.
# Replaces the default choose-tree session list (prefix , covers jumping).
bind s display-popup -w 90% -h 80% -E "~/bin/gc-proj board"

# Status bar: live Claude agent counts. ~/.tmux.conf.local may add more.
set -g status-interval 5
set -g status-right-length 100
# @claude_status is pushed by claude-agents hook for instant updates; #{E:...}
# re-expands it so the embedded #[...] colors render.
set -g status-right "#{?#{==:#{@claude_notify},on},🔔 ,}#{E:@claude_status}%H:%M "

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"

run '~/.tmux/plugins/tpm/tpm'
